<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Hashir File Archives</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #000000;
      color: #e6edf3;
      max-width: 900px;
      margin: 0 auto;
      padding: 24px;
      text-align: center;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Animated GIF Background Layer */
    .bg-wrapper {
      position: fixed;
      inset: 0;
      z-index: -1;
      background-color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      pointer-events: none;
    }
    .bg-wrapper img {
      width: 100%;
      max-width: 750px;
      height: auto;
      object-fit: contain;
      opacity: 0.65;
      filter: contrast(120%) drop-shadow(0 0 20px rgba(255, 0, 0, 0.35));
    }

    /* Loading & Password Overlay */
    #gate-overlay {
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(6px);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid #30363d;
      border-top-color: #ff2a2a;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .login-box {
      display: none;
      background-color: rgba(15, 15, 18, 0.9);
      border: 1px solid #4a1515;
      border-radius: 12px;
      padding: 28px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 0 25px rgba(255, 0, 0, 0.2);
    }
    .login-box h2 {
      color: #ff4444;
      margin-top: 0;
      margin-bottom: 16px;
      font-size: 1.3rem;
    }
    .login-box input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #30363d;
      background-color: #08080a;
      color: #e6edf3;
      font-size: 1rem;
      margin-bottom: 12px;
    }
    .login-box button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background-color: #b91c1c;
      color: #ffffff;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
    }
    .login-box button:hover {
      background-color: #dc2626;
    }
    #error-msg {
      color: #f85149;
      font-size: 0.85rem;
      margin-top: 10px;
      display: none;
    }

    /* Main Page Styles */
    #main-content {
      display: none;
      position: relative;
      z-index: 1;
    }
    nav {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 40px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(255, 68, 68, 0.25);
    }
    nav a {
      color: #9ca3af;
      text-decoration: none;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 8px;
      background-color: rgba(0, 0, 0, 0.5);
    }
    nav a.active, nav a:hover {
      color: #ffffff;
      background-color: rgba(185, 28, 28, 0.35);
      border: 1px solid rgba(255, 68, 68, 0.4);
    }
    h1 {
      color: #ff4444;
      text-shadow: 0 0 15px rgba(255, 0, 0, 0.5);
      margin-bottom: 28px;
    }
    .profile-card {
      background-color: rgba(12, 12, 16, 0.82);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 68, 68, 0.3);
      border-radius: 16px;
      padding: 24px;
      margin: 0 auto 32px auto;
      max-width: 550px;
      width: 100%;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.85);
    }
    .profile-card > img {
      width: 100%;
      height: auto;
      border-radius: 12px;
      display: block;
      margin-bottom: 16px;
    }
    .profile-card p {
      color: #e5e7eb;
      line-height: 1.6;
      margin: 0;
      font-size: 1.05rem;
    }

    /* Multi-Photo Evidence Card */
    .evidence-card {
      background-color: rgba(12, 12, 16, 0.82);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 68, 68, 0.3);
      border-radius: 16px;
      padding: 24px;
      margin: 0 auto 40px auto;
      max-width: 820px;
      width: 100%;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.85);
    }
    .evidence-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }
    .evidence-grid img {
      width: 100%;
      height: 260px;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid rgba(255, 68, 68, 0.25);
      display: block;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
    }
    .evidence-grid img:hover {
      transform: scale(1.03);
      border-color: #ff4444;
    }
    .evidence-card p {
      color: #e5e7eb;
      line-height: 1.6;
      margin: 0;
      font-size: 1.1rem;
      font-weight: 500;
    }

    /* Fullscreen Lightbox Popup */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.92);
      z-index: 10000;
      justify-content: center;
      align-items: center;
      padding: 20px;
      cursor: zoom-out;
    }
    .lightbox img {
      max-width: 95%;
      max-height: 95%;
      border-radius: 8px;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.9);
    }
  </style>
</head>
<body>

  <!-- Animated GIF Background Layer -->
  <div class="bg-wrapper">
    <img src="johnny.gif" alt="Background">
  </div>

  <!-- Loading Screen & Password Gate -->
  <div id="gate-overlay">
    <div id="loader">
      <div class="spinner"></div>
      <p style="color: #9ca3af;">Initializing archives...</p>
    </div>

    <div id="login-box" class="login-box">
      <h2>Restricted Access</h2>
      <input type="password" id="password-input" placeholder="Enter password" onkeydown="if(event.key==='Enter') checkPassword()">
      <button onclick="checkPassword()">Unlock</button>
      <p id="error-msg">Access denied. Try again.</p>
    </div>
  </div>

  <!-- Protected Website Content -->
  <div id="main-content">
    <nav>
      <a href="index.html">Screenshots</a>
      <a href="about.html" class="active">About Me</a>
    </nav>

    <h1>The Hashir File Archives</h1>

    <!-- Entry 1 -->
    <div class="profile-card">
      <img src="Screenshot%202026-11-16%20070341.png" alt="The Hashir File Archives">
      <p>should've invested in sec-ops cyberware security</p>
    </div>

    <!-- Entry 2 -->
    <div class="evidence-card">
      <div class="evidence-grid">
        <img src="Screenshot%202026-11-16%20173517.png" alt="Evidence 1" onclick="openLightbox('Screenshot%202026-11-16%20173517.png')">
        <img src="Screenshot%202026-11-16%20173542.png" alt="Evidence 2" onclick="openLightbox('Screenshot%202026-11-16%20173542.png')">
        <img src="Screenshot%202026-11-16%20173549.png" alt="Evidence 3" onclick="openLightbox('Screenshot%202026-11-16%20173549.png')">
        <img src="Screenshot%202026-11-16%20173556.png" alt="Evidence 4" onclick="openLightbox('Screenshot%202026-11-16%20173556.png')">
        <img src="Screenshot%202026-11-16%20173601.png" alt="Evidence 5" onclick="openLightbox('Screenshot%202026-11-16%20173601.png')">
      </div>
      <p>the big kebab man has been caught red-handed</p>
    </div>
  </div>

  <!-- Fullscreen Lightbox -->
  <div id="lightbox" class="lightbox" onclick="closeLightbox()">
    <img id="lightbox-img" src="" alt="Full Size Photo">
  </div>

  <script>
    const SITE_PASSWORD = "hashir123"; // Match your password here

    window.addEventListener("load", () => {
      setTimeout(() => {
        if (sessionStorage.getItem("unlocked") === "true") {
          unlockSite();
        } else {
          document.getElementById("loader").style.display = "none";
          document.getElementById("login-box").style.display = "block";
        }
      }, 1000);
    });

    function checkPassword() {
      const input = document.getElementById("password-input").value;
      if (input === SITE_PASSWORD) {
        sessionStorage.setItem("unlocked", "true");
        unlockSite();
      } else {
        document.getElementById("error-msg").style.display = "block";
      }
    }

    function unlockSite() {
      document.getElementById("gate-overlay").style.display = "none";
      document.getElementById("main-content").style.display = "block";
    }

    function openLightbox(imageSrc) {
      document.getElementById("lightbox-img").src = imageSrc;
      document.getElementById("lightbox").style.display = "flex";
    }

    function closeLightbox() {
      document.getElementById("lightbox").style.display = "none";
    }
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>thecrescent</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ========== PASSWORD SCREEN ========== */
    #password-screen {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px;
      background: #0d1117;
    }

    #password-screen .box {
      width: 100%;
      max-width: 360px;
    }

    #password-screen h1 {
      color: #58a6ff;
      margin-bottom: 8px;
      font-size: 1.8rem;
    }

    #password-screen p {
      color: #8b949e;
      margin-bottom: 28px;
      font-size: 0.95rem;
    }

    #password-input {
      width: 100%;
      padding: 14px 16px;
      font-size: 1rem;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      color: #e6edf3;
      outline: none;
      margin-bottom: 16px;
      transition: border-color 0.2s;
    }

    #password-input:focus {
      border-color: #58a6ff;
    }

    #enter-btn {
      width: 100%;
      padding: 14px;
      font-size: 1rem;
      font-weight: 600;
      background: #238636;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s;
    }

    #enter-btn:hover {
      background: #2ea043;
    }

    .error-msg {
      color: #f85149;
      margin-top: 14px;
      font-size: 0.9rem;
      display: none;
    }

    /* ========== LOADING SCREEN ========== */
    #loading-screen {
      display: none;
      height: 100vh;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px;
      background: #0d1117;
    }

    #loading-screen .box {
      width: 100%;
      max-width: 480px;
    }

    #loading-screen h2 {
      color: #58a6ff;
      margin-bottom: 40px;
      font-size: 1.4rem;
    }

    .progress-container {
      position: relative;
      width: 100%;
      height: 28px;
      background: #161b22;
      border-radius: 20px;
      border: 1px solid #30363d;
      overflow: visible;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #238636, #3fb950);
      border-radius: 20px;
      transition: width 0.1s linear;
    }

    .eggplant {
      position: absolute;
      top: 50%;
      left: 0%;
      transform: translate(-50%, -50%);
      font-size: 2.2rem;
      transition: left 0.1s linear;
      z-index: 5;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }

    .peach-target {
      position: absolute;
      top: 50%;
      right: -10px;
      transform: translateY(-50%);
      font-size: 2.8rem;
      z-index: 4;
    }

    .pfp-on-peach {
      position: absolute;
      top: 50%;
      right: -6px;
      transform: translateY(-50%);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 2.5px solid #ffffff;
      object-fit: cover;
      z-index: 6;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }

    .status-text {
      margin-top: 28px;
      color: #8b949e;
      font-size: 0.95rem;
    }

    /* ========== FINAL PINK HEARTS SCREEN ========== */
    #final-screen {
      display: none;
      min-height: 100vh;
      background: #ff9ecb;
      position: relative;
      overflow: hidden;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 40px 20px;
    }

    .hearts-bg {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }

    .heart {
      position: absolute;
      font-size: 1.8rem;
      opacity: 0.7;
      animation: float 6s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-18px) rotate(8deg); }
    }

    .final-content {
      position: relative;
      z-index: 2;
      background: rgba(255, 255, 255, 0.85);
      padding: 40px 50px;
      border-radius: 24px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.15);
      max-width: 520px;
    }

    .final-content h1 {
      font-size: 2rem;
      color: #d63384;
      margin-bottom: 12px;
    }

    .final-message {
      font-size: 1.6rem;
      color: #c2255c;
      font-weight: 600;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <!-- PASSWORD SCREEN -->
  <div id="password-screen">
    <div class="box">
      <h1>Enter Password</h1>
      <p>Access required</p>
      <input type="password" id="password-input" placeholder="Password" autocomplete="off">
      <button id="enter-btn">Enter</button>
      <div class="error-msg" id="error-msg">Wrong password</div>
    </div>
  </div>

  <!-- LOADING SCREEN -->
  <div id="loading-screen">
    <div class="box">
      <h2>Loading...</h2>
      
      <div class="progress-container">
        <div class="progress-bar" id="progress-bar"></div>
        <div class="eggplant" id="eggplant">🍆</div>
        <div class="peach-target">🍑</div>
        <img src="image.jpg" alt="pfp" class="pfp-on-peach">
      </div>

      <p class="status-text" id="status-text">Initializing...</p>
    </div>
  </div>

  <!-- FINAL PINK HEARTS SCREEN -->
  <div id="final-screen">
    <div class="hearts-bg" id="hearts-bg"></div>
    
    <div class="final-content">
      <h1>💕</h1>
      <div class="final-message">
        xoxo from jay-z and hashir 😘🥵🥵
      </div>
    </div>
  </div>

  <script>
    const passwordScreen = document.getElementById('password-screen');
    const loadingScreen = document.getElementById('loading-screen');
    const finalScreen = document.getElementById('final-screen');
    const enterBtn = document.getElementById('enter-btn');
    const passwordInput = document.getElementById('password-input');
    const errorMsg = document.getElementById('error-msg');
    const progressBar = document.getElementById('progress-bar');
    const eggplant = document.getElementById('eggplant');
    const statusText = document.getElementById('status-text');

    const correctPassword = "h@$h!r_69";

    enterBtn.addEventListener('click', checkPassword);
    passwordInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') checkPassword();
    });

    function checkPassword() {
      if (passwordInput.value === correctPassword) {
        errorMsg.style.display = 'none';
        passwordScreen.style.display = 'none';
        loadingScreen.style.display = 'flex';
        startLoading();
      } else {
        errorMsg.style.display = 'block';
        passwordInput.value = '';
        passwordInput.focus();
      }
    }

    function startLoading() {
      let progress = 0;
      const interval = setInterval(() => {
        progress += 1.1;
        if (progress > 100) progress = 100;

        progressBar.style.width = progress + '%';
        eggplant.style.left = progress + '%';

        if (progress < 25) statusText.textContent = "Warming up...";
        else if (progress < 50) statusText.textContent = "Almost there...";
        else if (progress < 80) statusText.textContent = "Getting closer...";
        else if (progress < 100) statusText.textContent = "Final approach...";
        else {
          statusText.textContent = "Done 🍑";
          clearInterval(interval);
          
          setTimeout(() => {
            loadingScreen.style.display = 'none';
            finalScreen.style.display = 'flex';
            createHearts();
          }, 700);
        }
      }, 38);
    }

    // Create floating hearts
    function createHearts() {
      const container = document.getElementById('hearts-bg');
      const heartEmojis = ['💖', '💗', '💓', '💕', '❤️', '💘', '💝'];

      for (let i = 0; i < 45; i++) {
        const heart = document.createElement('div');
        heart.className = 'heart';
        heart.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
        heart.style.left = Math.random() * 100 + '%';
        heart.style.top = Math.random() * 100 + '%';
        heart.style.fontSize = (1.2 + Math.random() * 1.8) + 'rem';
        heart.style.animationDuration = (4 + Math.random() * 5) + 's';
        heart.style.animationDelay = (Math.random() * 3) + 's';
        container.appendChild(heart);
      }
    }
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>thecrescent | Screenshots</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ========== PASSWORD SCREEN ========== */
    #password-screen {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px;
      background: #0d1117;
    }

    #password-screen .box {
      width: 100%;
      max-width: 360px;
    }

    #password-screen h1 {
      color: #58a6ff;
      margin-bottom: 8px;
      font-size: 1.8rem;
    }

    #password-screen p {
      color: #8b949e;
      margin-bottom: 28px;
      font-size: 0.95rem;
    }

    #password-input {
      width: 100%;
      padding: 14px 16px;
      font-size: 1rem;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      color: #e6edf3;
      outline: none;
      margin-bottom: 16px;
      transition: border-color 0.2s;
    }

    #password-input:focus {
      border-color: #58a6ff;
    }

    #enter-btn {
      width: 100%;
      padding: 14px;
      font-size: 1rem;
      font-weight: 600;
      background: #238636;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s;
    }

    #enter-btn:hover {
      background: #2ea043;
    }

    .error-msg {
      color: #f85149;
      margin-top: 14px;
      font-size: 0.9rem;
      display: none;
    }

    /* ========== LOADING SCREEN ========== */
    #loading-screen {
      display: none;
      height: 100vh;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px;
      background: #0d1117;
    }

    #loading-screen .box {
      width: 100%;
      max-width: 480px;
    }

    #loading-screen h2 {
      color: #58a6ff;
      margin-bottom: 40px;
      font-size: 1.4rem;
    }

    .progress-container {
      position: relative;
      width: 100%;
      height: 28px;
      background: #161b22;
      border-radius: 20px;
      border: 1px solid #30363d;
      overflow: visible;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #238636, #3fb950);
      border-radius: 20px;
      transition: width 0.1s linear;
    }

    /* Eggplant + PFP that move together */
    .eggplant-wrapper {
      position: absolute;
      top: 50%;
      left: 0%;
      transform: translate(-50%, -50%);
      transition: left 0.1s linear;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .eggplant {
      font-size: 2.2rem;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }

    .pfp-on-eggplant {
      position: absolute;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid #ffffff;
      object-fit: cover;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
    }

    .peach-target {
      position: absolute;
      top: 50%;
      right: -10px;
      transform: translateY(-50%);
      font-size: 2.8rem;
      z-index: 4;
    }

    .status-text {
      margin-top: 28px;
      color: #8b949e;
      font-size: 0.95rem;
    }

    /* ========== PINK MESSAGE SCREEN ========== */
    #message-screen {
      display: none;
      min-height: 100vh;
      background: #ff9ecb;
      position: relative;
      overflow: hidden;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 40px 20px;
    }

    .hearts-bg {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }

    .heart {
      position: absolute;
      font-size: 1.8rem;
      opacity: 0.7;
      animation: float 6s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-18px) rotate(8deg); }
    }

    .final-content {
      position: relative;
      z-index: 2;
      background: rgba(255, 255, 255, 0.88);
      padding: 40px 50px;
      border-radius: 24px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.15);
      max-width: 520px;
    }

    .final-message {
      font-size: 1.7rem;
      color: #c2255c;
      font-weight: 600;
      line-height: 1.4;
    }

    /* ========== GALLERY SCREEN ========== */
    #gallery-screen {
      display: none;
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px;
      text-align: center;
    }

    nav {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 32px;
      padding-bottom: 16px;
      border-bottom: 1px solid #30363d;
    }

    nav a {
      color: #8b949e;
      text-decoration: none;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 8px;
    }

    nav a.active, nav a:hover {
      color: #ffffff;
      background-color: #161b22;
    }

    #gallery-screen h1 {
      color: #58a6ff;
      margin-bottom: 8px;
    }

    p.hint {
      color: #8b949e;
      font-size: 0.9rem;
      margin-bottom: 32px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
    }

    .photo-card {
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
    }

    .photo-card:hover {
      transform: translateY(-4px);
      border-color: #58a6ff;
    }

    .photo-card img {
      width: 100%;
      height: 520px;
      object-fit: cover;
      object-position: top;
      display: block;
    }

    .caption {
      padding: 12px;
      font-size: 0.9rem;
      color: #8b949e;
      border-top: 1px solid #30363d;
    }

    .lightbox {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.9);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 20px;
      cursor: zoom-out;
    }

    .lightbox img {
      max-width: 95%;
      max-height: 95%;
      border-radius: 8px;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
    }
  </style>
</head>
<body>

  <!-- PASSWORD SCREEN -->
  <div id="password-screen">
    <div class="box">
      <h1>Enter Password</h1>
      <p>Access required</p>
      <input type="password" id="password-input" placeholder="Password" autocomplete="off">
      <button id="enter-btn">Enter</button>
      <div class="error-msg" id="error-msg">Wrong password</div>
    </div>
  </div>

  <!-- LOADING SCREEN -->
  <div id="loading-screen">
    <div class="box">
      <h2>Loading...</h2>
      
      <div class="progress-container">
        <div class="progress-bar" id="progress-bar"></div>

        <!-- Eggplant + PFP moving together -->
        <div class="eggplant-wrapper" id="eggplant-wrapper">
          <div class="eggplant">🍆</div>
          <img src="image.jpg" alt="pfp" class="pfp-on-eggplant">
        </div>

        <div class="peach-target">🍑</div>
      </div>

      <p class="status-text" id="status-text">Initializing...</p>
    </div>
  </div>

  <!-- PINK MESSAGE SCREEN (shows for 2 seconds) -->
  <div id="message-screen">
    <div class="hearts-bg" id="hearts-bg"></div>
    <div class="final-content">
      <div class="final-message">
        xoxo from jay-z and hashir 😘🥵🥵
      </div>
    </div>
  </div>

  <!-- GALLERY SCREEN -->
  <div id="gallery-screen">
    <nav>
      <a href="#" class="active">Screenshots</a>
      <a href="about.html">About Me</a>
    </nav>

    <h1>Screenshots</h1>
    <p class="hint">Click any screenshot to view the full uncropped image</p>

    <div class="gallery">
      <div class="photo-card" onclick="openLightbox('Screenshot%202026-11-16%20064113.png')">
        <img src="Screenshot%202026-11-16%20064113.png" alt="Screenshot 1">
        <div class="caption">1</div>
      </div>

      <div class="photo-card" onclick="openLightbox('Screenshot%202026-11-16%20064121.png')">
        <img src="Screenshot%202026-11-16%20064121.png" alt="Screenshot 2">
        <div class="caption">2</div>
      </div>

      <div class="photo-card" onclick="openLightbox('Screenshot%202026-11-16%20064134.png')">
        <img src="Screenshot%202026-11-16%20064134.png" alt="Screenshot 3">
        <div class="caption">3</div>
      </div>

      <div class="photo-card" onclick="openLightbox('Screenshot%202026-11-16%20064158.png')">
        <img src="Screenshot%202026-11-16%20064158.png" alt="Screenshot 4">
        <div class="caption">4</div>
      </div>

      <div class="photo-card" onclick="openLightbox('Screenshot%202026-11-16%20064206.png')">
        <img src="Screenshot%202026-11-16%20064206.png" alt="Screenshot 5">
        <div class="caption">5</div>
      </div>

      <div class="photo-card" onclick="openLightbox('Screenshot%202026-11-16%20064215.png')">
        <img src="Screenshot%202026-11-16%20064215.png" alt="Screenshot 6">
        <div class="caption">6</div>
      </div>

      <div class="photo-card" onclick="openLightbox('Screenshot%202026-11-16%20064224.png')">
        <img src="Screenshot%202026-11-16%20064224.png" alt="Screenshot 7">
        <div class="caption">7</div>
      </div>

      <div class="photo-card" onclick="openLightbox('Screenshot%202026-11-16%20064236.png')">
        <img src="Screenshot%202026-11-16%20064236.png" alt="Screenshot 8">
        <div class="caption">8</div>
      </div>

      <div class="photo-card" onclick="openLightbox('Screenshot%202026-11-16%20064250.png')">
        <img src="Screenshot%202026-11-16%20064250.png" alt="Screenshot 9">
        <div class="caption">9</div>
      </div>

      <div class="photo-card" onclick="openLightbox('Screenshot%202026-11-16%20064259.png')">
        <img src="Screenshot%202026-11-16%20064259.png" alt="Screenshot 10">

      <div class="photo-card" onclick="openLightbox('Screenshot%202026-11-16%20064310.png')">
        <img src="Screenshot%202026-11-16%20064310.png" alt="Screenshot 11">

      <div class="photo-card" onclick="openLightbox('Screenshot%202026-11-16%20064330.png')">
        <img src="Screenshot%202026-11-16%20064330.png" alt="Screenshot 12">

      </div>

      <div class="photo-card" onclick="openLightbox('Screenshot%202026-11-16%20064411.png')">
        <img src="Screenshot%202026-11-16%20064411.png" alt="Screenshot 13">
        <div class="caption">13</div>
      </div>
    </div>
  </div>

  <!-- LIGHTBOX -->
  <div id="lightbox" class="lightbox" onclick="closeLightbox()">
    <img id="lightbox-img" src="" alt="Full Size Screenshot">
  </div>

  <script>
    const passwordScreen = document.getElementById('password-screen');
    const loadingScreen = document.getElementById('loading-screen');
    const messageScreen = document.getElementById('message-screen');
    const galleryScreen = document.getElementById('gallery-screen');
    const enterBtn = document.getElementById('enter-btn');
    const passwordInput = document.getElementById('password-input');
    const errorMsg = document.getElementById('error-msg');
    const progressBar = document.getElementById('progress-bar');
    const eggplantWrapper = document.getElementById('eggplant-wrapper');
    const statusText = document.getElementById('status-text');

    const correctPassword = "h@$h!r_69";

    enterBtn.addEventListener('click', checkPassword);
    passwordInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') checkPassword();
    });

    function checkPassword() {
      if (passwordInput.value === correctPassword) {
        errorMsg.style.display = 'none';
        passwordScreen.style.display = 'none';
        loadingScreen.style.display = 'flex';
        startLoading();
      } else {
        errorMsg.style.display = 'block';
        passwordInput.value = '';
        passwordInput.focus();
      }
    }

    function startLoading() {
      let progress = 0;
      const interval = setInterval(() => {
        progress += 1.1;
        if (progress > 100) progress = 100;

        progressBar.style.width = progress + '%';
        eggplantWrapper.style.left = progress + '%';

        if (progress < 25) statusText.textContent = "Warming up...";
        else if (progress < 50) statusText.textContent = "Almost there...";
        else if (progress < 80) statusText.textContent = "Getting closer...";
        else if (progress < 100) statusText.textContent = "Final approach...";
        else {
          statusText.textContent = "Done 🍑";
          clearInterval(interval);

          // Show pink message for 2 seconds, then gallery
          setTimeout(() => {
            loadingScreen.style.display = 'none';
            messageScreen.style.display = 'flex';
            createHearts();

            // After 2 seconds go to gallery
            setTimeout(() => {
              messageScreen.style.display = 'none';
              galleryScreen.style.display = 'block';
            }, 2000);
          }, 600);
        }
      }, 38);
    }

    function createHearts() {
      const container = document.getElementById('hearts-bg');
      const heartEmojis = ['💖', '💗', '💓', '💕', '❤️', '💘', '💝'];

      for (let i = 0; i < 45; i++) {
        const heart = document.createElement('div');
        heart.className = 'heart';
        heart.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
        heart.style.left = Math.random() * 100 + '%';
        heart.style.top = Math.random() * 100 + '%';
        heart.style.fontSize = (1.2 + Math.random() * 1.8) + 'rem';
        heart.style.animationDuration = (4 + Math.random() * 5) + 's';
        heart.style.animationDelay = (Math.random() * 3) + 's';
        container.appendChild(heart);
      }
    }

    // Lightbox
    function openLightbox(imageSrc) {
      document.getElementById('lightbox-img').src = imageSrc;
      document.getElementById('lightbox').style.display = 'flex';
    }

    function closeLightbox() {
      document.getElementById('lightbox').style.display = 'none';
    }
  </script>

</body>
</html>

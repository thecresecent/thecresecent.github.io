<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>thecrescent | Screenshots</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #ff9ecb;
      color: #e6edf3;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ========== PASSWORD SCREEN ========== */
    #password-screen {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px;
      background: #0d1117;
    }

    #password-screen .box {
      width: 100%;
      max-width: 360px;
    }

    #password-screen h1 {
      color: #58a6ff;
      margin-bottom: 8px;
      font-size: 1.8rem;
    }

    #password-screen p {
      color: #8b949e;
      margin-bottom: 28px;
      font-size: 0.95rem;
    }

    #password-input {
      width: 100%;
      padding: 14px 16px;
      font-size: 1rem;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      color: #e6edf3;
      outline: none;
      margin-bottom: 16px;
      transition: border-color 0.2s;
    }

    #password-input:focus {
      border-color: #58a6ff;
    }

    #enter-btn {
      width: 100%;
      padding: 14px;
      font-size: 1rem;
      font-weight: 600;
      background: #238636;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s;
    }

    #enter-btn:hover {
      background: #2ea043;
    }

    .error-msg {
      color: #f85149;
      margin-top: 14px;
      font-size: 0.9rem;
      display: none;
    }

    /* ========== LOADING SCREEN ========== */
    #loading-screen {
      display: none;
      height: 100vh;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px;
      background: #0d1117;
    }

    #loading-screen .box {
      width: 100%;
      max-width: 480px;
    }

    #loading-screen h2 {
      color: #58a6ff;
      margin-bottom: 40px;
      font-size: 1.4rem;
    }

    .progress-container {
      position: relative;
      width: 100%;
      height: 28px;
      background: #161b22;
      border-radius: 20px;
      border: 1px solid #30363d;
      overflow: visible;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #238636, #3fb950);
      border-radius: 20px;
      transition: width 0.08s linear;
    }

    .eggplant-wrapper {
      position: absolute;
      top: 50%;
      left: 0%;
      transform: translate(-50%, -50%);
      transition: left 0.08s linear;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 6px;
      will-change: left, transform, opacity;
    }

    /* Clean dive into the peach */
    .eggplant-wrapper.inside {
      left: calc(100% + 14px) !important;   /* matches the new peach position */
      transform: translate(-50%, -50%) scale(0.2);
      opacity: 0;
      transition: left 0.38s cubic-bezier(0.34, 1.45, 0.64, 1),
                  transform 0.38s cubic-bezier(0.34, 1.45, 0.64, 1),
                  opacity 0.22s ease 0.12s;
    }

    .eggplant {
      font-size: 2.2rem;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }

    .pfp-next-to-eggplant {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 2.5px solid #ffffff;
      object-fit: cover;
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
      transition: opacity 0.2s ease;
    }

    /* Peach moved further right */
    .peach-target {
      position: absolute;
      top: 50%;
      right: -22px;          /* was -10px → moved right */
      transform: translateY(-50%);
      font-size: 2.8rem;
      z-index: 4;
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .peach-target.react {
      transform: translateY(-50%) scale(1.3);
    }

    /* Burst particles (hearts + droplets) */
    .particle {
      position: absolute;
      pointer-events: none;
      z-index: 6;
      opacity: 0;
      animation: particle-burst 0.95s ease-out forwards;
      font-size: 1.25rem;
    }

    @keyframes particle-burst {
      0% {
        opacity: 1;
        transform: translate(0, 0) scale(1) rotate(0deg);
      }
      100% {
        opacity: 0;
        transform: translate(var(--dx), var(--dy)) scale(0.35) rotate(var(--rot));
      }
    }

    .status-text {
      margin-top: 28px;
      color: #8b949e;
      font-size: 0.95rem;
    }

    /* ========== MAIN CONTENT ========== */
    #main-content {
      display: none;
      position: relative;
      min-height: 100vh;
      background: #ff9ecb;
      padding-top: 120px;
      padding-bottom: 40px;
    }

    .hearts-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }

    .heart {
      position: absolute;
      font-size: 1.8rem;
      opacity: 0.65;
      animation: float 6s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-18px) rotate(8deg); }
    }

    #xoxo-box {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      background: rgba(255, 255, 255, 0.9);
      padding: 28px 40px;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.15);
      text-align: center;
      transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #xoxo-box.slide-up {
      top: 24px;
      transform: translate(-50%, 0);
      padding: 14px 28px;
      border-radius: 14px;
    }

    .final-message {
      font-size: 1.6rem;
      color: #c2255c;
      font-weight: 600;
      line-height: 1.3;
      white-space: nowrap;
    }

    #xoxo-box.slide-up .final-message {
      font-size: 1.15rem;
    }

    /* Gallery */
    #gallery-screen {
      position: relative;
      z-index: 5;
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px;
      text-align: center;
      opacity: 0;
      transition: opacity 0.6s ease;
    }

    #gallery-screen.show {
      opacity: 1;
    }

    nav {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 28px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(0,0,0,0.1);
    }

    nav a {
      color: #9b2c5a;
      text-decoration: none;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 8px;
      background: rgba(255,255,255,0.4);
    }

    nav a.active, nav a:hover {
      color: #ffffff;
      background-color: #d63384;
    }

    #gallery-screen h1 {
      color: #c2255c;
      margin-bottom: 8px;
      font-size: 2rem;
    }

    p.hint {
      color: #9b2c5a;
      font-size: 0.95rem;
      margin-bottom: 32px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
    }

    .photo-card {
      background-color: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(0,0,0,0.08);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .photo-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 24px rgba(0,0,0,0.12);
    }

    .photo-card img {
      width: 100%;
      height: 520px;
      object-fit: cover;
      object-position: top;
      display: block;
    }

    .caption {
      padding: 12px;
      font-size: 0.9rem;
      color: #9b2c5a;
      border-top: 1px solid rgba(0,0,0,0.06);
    }

    /* Lightbox */
    .lightbox {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.92);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 20px;
      cursor: zoom-out;
    }

    .lightbox img {
      max-width: 92%;
      max-height: 90%;
      border-radius: 8px;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.7);
      user-select: none;
    }

    .lightbox-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,0.15);
      border: none;
      color: white;
      font-size: 2.2rem;
      width: 54px;
      height: 54px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
      z-index: 1001;
    }

    .lightbox-nav:hover {
      background: rgba(255,255,255,0.3);
    }

    .lightbox-nav.prev {
      left: 24px;
    }

    .lightbox-nav.next {
      right: 24px;
    }

    .lightbox-counter {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.8);
      font-size: 0.95rem;
      background: rgba(0,0,0,0.4);
      padding: 6px 14px;
      border-radius: 20px;
    }
  </style>
</head>
<body>

  <!-- PASSWORD SCREEN -->
  <div id="password-screen">
    <div class="box">
      <h1>Enter Password</h1>
      <p>Access required</p>
      <input type="password" id="password-input" placeholder="Password" autocomplete="off">
      <button id="enter-btn">Enter</button>
      <div class="error-msg" id="error-msg">Wrong password</div>
    </div>
  </div>

  <!-- LOADING SCREEN -->
  <div id="loading-screen">
    <div class="box">
      <h2>Loading...</h2>
      
      <div class="progress-container">
        <div class="progress-bar" id="progress-bar"></div>

        <div class="eggplant-wrapper" id="eggplant-wrapper">
          <img src="image.jpg" alt="pfp" class="pfp-next-to-eggplant">
          <div class="eggplant">🍆</div>
        </div>

        <div class="peach-target" id="peach-target">🍑</div>
      </div>

      <p class="status-text" id="status-text">Initializing...</p>
    </div>
  </div>

  <!-- MAIN CONTENT -->
  <div id="main-content">
    <div class="hearts-bg" id="hearts-bg"></div>

    <div id="xoxo-box">
      <div class="final-message">
        xoxo from jay-z and hashir 😘🥵🥵
      </div>
    </div>

    <div id="gallery-screen">
      <nav>
        <a href="#" class="active">Screenshots</a>
        <a href="about.html">About Me</a>
      </nav>

      <h1>Screenshots</h1>
      <p class="hint">Click any screenshot to view the full uncropped image • Use ← → arrow keys to navigate</p>

      <div class="gallery">
        <div class="photo-card" onclick="openLightbox(0)">
          <img src="Screenshot%202026-11-16%20064113.png" alt="Screenshot 1">
          <div class="caption">1</div>
        </div>

        <div class="photo-card" onclick="openLightbox(1)">
          <img src="Screenshot%202026-11-16%20064121.png" alt="Screenshot 2">
          <div class="caption">2</div>
        </div>

        <div class="photo-card" onclick="openLightbox(2)">
          <img src="Screenshot%202026-11-16%20064134.png" alt="Screenshot 3">
          <div class="caption">3</div>
        </div>

        <div class="photo-card" onclick="openLightbox(3)">
          <img src="Screenshot%202026-11-16%20064158.png" alt="Screenshot 4">
          <div class="caption">4</div>
        </div>

        <div class="photo-card" onclick="openLightbox(4)">
          <img src="Screenshot%202026-11-16%20064206.png" alt="Screenshot 5">
          <div class="caption">5</div>
        </div>

        <div class="photo-card" onclick="openLightbox(5)">
          <img src="Screenshot%202026-11-16%20064215.png" alt="Screenshot 6">
          <div class="caption">6</div>
        </div>

        <div class="photo-card" onclick="openLightbox(6)">
          <img src="Screenshot%202026-11-16%20064224.png" alt="Screenshot 7">
          <div class="caption">7</div>
        </div>

        <div class="photo-card" onclick="openLightbox(7)">
          <img src="Screenshot%202026-11-16%20064236.png" alt="Screenshot 8">
          <div class="caption">8</div>
        </div>

        <div class="photo-card" onclick="openLightbox(8)">
          <img src="Screenshot%202026-11-16%20064259.png" alt="Screenshot 9">
          <div class="caption">9</div>
        </div>

        <div class="photo-card" onclick="openLightbox(9)">
          <img src="Screenshot%202026-11-16%20064310.png" alt="Screenshot 10">
          <div class="caption">10</div>
        </div>

        <div class="photo-card" onclick="openLightbox(10)">
          <img src="Screenshot%202026-11-16%20064330.png" alt="Screenshot 11">
          <div class="caption">11</div>
        </div>

        <div class="photo-card" onclick="openLightbox(11)">
          <img src="Screenshot%202026-11-16%20064411.png" alt="Screenshot 12">
          <div class="caption">12</div>
        </div>
      </div>
    </div>
  </div>

  <!-- LIGHTBOX -->
  <div id="lightbox" class="lightbox" onclick="closeLightbox(event)">
    <button class="lightbox-nav prev" onclick="event.stopPropagation(); changeImage(-1)">‹</button>
    <img id="lightbox-img" src="" alt="Full Size Screenshot">
    <button class="lightbox-nav next" onclick="event.stopPropagation(); changeImage(1)">›</button>
    <div class="lightbox-counter" id="lightbox-counter"></div>
  </div>

  <script>
    const passwordScreen = document.getElementById('password-screen');
    const loadingScreen = document.getElementById('loading-screen');
    const mainContent = document.getElementById('main-content');
    const xoxoBox = document.getElementById('xoxo-box');
    const galleryScreen = document.getElementById('gallery-screen');
    const enterBtn = document.getElementById('enter-btn');
    const passwordInput = document.getElementById('password-input');
    const errorMsg = document.getElementById('error-msg');
    const progressBar = document.getElementById('progress-bar');
    const eggplantWrapper = document.getElementById('eggplant-wrapper');
    const peachTarget = document.getElementById('peach-target');
    const statusText = document.getElementById('status-text');

    const correctPassword = "h@$h!r_69";

    const images = [
      "Screenshot%202026-11-16%20064113.png",
      "Screenshot%202026-11-16%20064121.png",
      "Screenshot%202026-11-16%20064134.png",
      "Screenshot%202026-11-16%20064158.png",
      "Screenshot%202026-11-16%20064206.png",
      "Screenshot%202026-11-16%20064215.png",
      "Screenshot%202026-11-16%20064224.png",
      "Screenshot%202026-11-16%20064236.png",
      "Screenshot%202026-11-16%20064259.png",
      "Screenshot%202026-11-16%20064310.png",
      "Screenshot%202026-11-16%20064330.png",
      "Screenshot%202026-11-16%20064411.png"
    ];

    let currentIndex = 0;

    enterBtn.addEventListener('click', checkPassword);
    passwordInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') checkPassword();
    });

    function checkPassword() {
      if (passwordInput.value === correctPassword) {
        errorMsg.style.display = 'none';
        passwordScreen.style.display = 'none';
        loadingScreen.style.display = 'flex';
        startLoading();
      } else {
        errorMsg.style.display = 'block';
        passwordInput.value = '';
        passwordInput.focus();
      }
    }

    function spawnBurst() {
      const container = document.querySelector('.progress-container');
      const peachRect = peachTarget.getBoundingClientRect();
      const containerRect = container.getBoundingClientRect();

      const originX = peachRect.left + peachRect.width / 2 - containerRect.left;
      const originY = peachRect.top + peachRect.height / 2 - containerRect.top;

      const particles = ['💖', '💗', '💕', '❤️', '💘', '💝', '💧', '💦', '💖', '💗', '💕', '❤️'];

      particles.forEach((emoji, i) => {
        const p = document.createElement('div');
        p.className = 'particle';
        p.textContent = emoji;

        const angle = (Math.random() * 160 - 80) * (Math.PI / 180);
        const distance = 35 + Math.random() * 85;
        const dx = Math.sin(angle) * distance;
        const dy = -Math.cos(angle) * distance - 15;
        const rot = (Math.random() * 60 - 30) + 'deg';

        p.style.left = originX + 'px';
        p.style.top = originY + 'px';
        p.style.setProperty('--dx', dx + 'px');
        p.style.setProperty('--dy', dy + 'px');
        p.style.setProperty('--rot', rot);
        p.style.animationDelay = (i * 0.03) + 's';

        container.appendChild(p);
        setTimeout(() => p.remove(), 1100);
      });
    }

    function startLoading() {
      let progress = 0;

      const interval = setInterval(() => {
        const rand = Math.random();

        if (rand < 0.12 && progress > 8 && progress < 90) {
          progress -= (0.5 + Math.random() * 1.2);
        } else if (rand < 0.22 && progress > 5) {
          progress += Math.random() * 0.2;
        } else {
          progress += (0.75 + Math.random() * 1.5);
        }

        if (progress > 100) progress = 100;
        if (progress < 0) progress = 0;

        progressBar.style.width = progress + '%';
        eggplantWrapper.style.left = progress + '%';

        if (progress < 25) statusText.textContent = "Warming up...";
        else if (progress < 50) statusText.textContent = "Almost there...";
        else if (progress < 80) statusText.textContent = "Getting closer...";
        else if (progress < 100) statusText.textContent = "Final approach...";
        else {
          statusText.textContent = "Done 🍑";
          clearInterval(interval);

          // Hide the profile pic first
          const pfp = eggplantWrapper.querySelector('.pfp-next-to-eggplant');
          if (pfp) pfp.style.opacity = '0';

          // Dive cleanly into the peach
          setTimeout(() => {
            eggplantWrapper.classList.add('inside');
            peachTarget.classList.add('react');
            spawnBurst();
          }, 60);

          setTimeout(() => {
            loadingScreen.style.display = 'none';
            mainContent.style.display = 'block';
            createHearts();

            setTimeout(() => {
              xoxoBox.classList.add('slide-up');
              setTimeout(() => {
                galleryScreen.classList.add('show');
              }, 850);
            }, 1100);
          }, 900);
        }
      }, 42);
    }

    function createHearts() {
      const container = document.getElementById('hearts-bg');
      const heartEmojis = ['💖', '💗', '💓', '💕', '❤️', '💘', '💝'];

      for (let i = 0; i < 50; i++) {
        const heart = document.createElement('div');
        heart.className = 'heart';
        heart.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
        heart.style.left = Math.random() * 100 + '%';
        heart.style.top = Math.random() * 100 + '%';
        heart.style.fontSize = (1.2 + Math.random() * 1.8) + 'rem';
        heart.style.animationDuration = (4 + Math.random() * 5) + 's';
        heart.style.animationDelay = (Math.random() * 3) + 's';
        container.appendChild(heart);
      }
    }

    // ===== Lightbox =====
    function openLightbox(index) {
      currentIndex = index;
      updateLightbox();
      document.getElementById('lightbox').style.display = 'flex';
    }

    function updateLightbox() {
      const img = document.getElementById('lightbox-img');
      img.src = images[currentIndex];
      document.getElementById('lightbox-counter').textContent = 
        `${currentIndex + 1} / ${images.length}`;
    }

    function changeImage(dir) {
      currentIndex = (currentIndex + dir + images.length) % images.length;
      updateLightbox();
    }

    function closeLightbox(e) {
      if (e.target.id === 'lightbox' || e.target.classList.contains('lightbox')) {
        document.getElementById('lightbox').style.display = 'none';
      }
    }

    document.addEventListener('keydown', (e) => {
      const lightbox = document.getElementById('lightbox');
      if (lightbox.style.display !== 'flex') return;

      if (e.key === 'ArrowLeft') changeImage(-1);
      else if (e.key === 'ArrowRight') changeImage(1);
      else if (e.key === 'Escape') lightbox.style.display = 'none';
    });
  </script>

</body>
</html>
